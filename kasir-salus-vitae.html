<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Salus Vitae Apotheca</title>
<style>
:root{--bg:#fffaf5;--card:#fff;--ink:#1b3a36;--mut:#5f7873;--line:#f1dcc8;--teal:#0b8a7d;--teal2:#00695f;color-scheme:light;--or:#e8873a;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Georgia,'Times New Roman',serif;padding-bottom:76px}
button,input{font:inherit;color:inherit}
header{background:var(--card);border-bottom:3px solid var(--or);padding:10px 14px;display:flex;align-items:center;gap:12px}
header .lg{background:#fff;border-radius:8px;padding:2px 6px}header img{height:42px;display:block}
header b{font-size:13px;color:var(--mut);font-weight:400;font-style:italic}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:17px;color:var(--teal)}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.btn{border:0;border-radius:8px;padding:11px 14px;background:var(--teal);color:var(--on);font-weight:700;cursor:pointer;width:100%}
.btn.s{width:auto;padding:6px 10px;background:#fff;color:#b85c12;border:1px solid var(--or);font-weight:700}
.btn.d{background:transparent;color:#c0392b;border:1px solid #c0392b}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .n{flex:1;min-width:0}.row small{color:var(--mut);display:block}
.pl{max-height:260px;overflow-y:auto}.pl .row{cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:8px 0}
.stat{background:var(--teal);color:var(--on);border-radius:10px;padding:12px;margin-bottom:8px}
.stat span{font-size:13px;opacity:.9}.stat div{font-size:22px;font-weight:700}
.stat.o{background:var(--or);color:#2b1400}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 0;border:0;background:none;font-weight:700;color:var(--mut);cursor:pointer}
nav button.on{color:var(--teal);box-shadow:inset 0 3px var(--or)}
.q{display:inline-flex;align-items:center;gap:6px}.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.ed{width:84px;padding:6px}.sec{display:none}.sec.on{display:block}
.low{color:#c0392b;font-weight:700}
#mod{display:none;position:fixed;inset:0;background:rgba(255,246,238,.97);z-index:50;overflow:auto;padding:16px}#mod.on{display:block}
#struk{width:58mm;max-width:100%;margin:0 auto 12px;background:#fff;color:#000;padding:3mm;box-sizing:border-box;border:1px solid #e8873a;box-shadow:0 2px 10px rgba(232,135,58,.25);font:12px/1.3 'Arial Narrow','Liberation Sans Narrow','Nimbus Sans Narrow',Arial,sans-serif;font-stretch:condensed}
#struk img{height:34px;display:block;margin:0 auto 4px;filter:grayscale(1) contrast(1.5)}#struk .c{text-align:center}#struk .r{display:flex;justify-content:space-between;gap:6px}#struk hr{border:0;border-top:1px dashed #000;margin:5px 0}
.bar{width:58mm;max-width:100%;margin:0 auto}.bar .btn.d{background:var(--card)}
@media print{body>*:not(#mod){display:none!important}#mod{position:static!important;background:none!important;display:block!important;padding:0!important;overflow:visible}.bar{display:none!important}#struk{margin:0;padding:2mm 3mm;border:0;box-shadow:none}@page{size:58mm auto;margin:0}}</style><script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script></head><body>

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.sec').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.t).classList.add('on');if(b.dataset.t=='obat')rO();if(b.dataset.t=='kasir')rP()});
function rP(){const q=$('cari').value.toLowerCase();const l=P.filter(p=>p.name.toLowerCase().includes(q));$('pl').innerHTML=l.map(p=>`<div class="row" onclick="add(${p.id})"><div class="n">${esc(p.name)}<small>${rp(p.price)} · stok <span class="${p.stock<=5?'low':''}">${p.stock}</span></small></div><button class="btn s">Tambah</button></div>`).join('')||'<small>Obat tidak ditemukan. Tambahkan di tab Obat.</small>'}
function add(id){const p=P.find(x=>x.id==id);if((cart[id]||0)>=p.stock)return alert('Stok '+p.name+' tidak cukup.');cart[id]=(cart[id]||0)+1;rC()}
function ch(id,d){const p=P.find(x=>x.id==id);const q=(cart[id]||0)+d;if(q<=0)delete cart[id];else if(q<=p.stock)cart[id]=q;rC()}
const total=()=>Object.keys(cart).reduce((s,id)=>s+P.find(x=>x.id==id).price*cart[id],0);
function rC(){const k=Object.keys(cart);$('cart').innerHTML=k.map(id=>{const p=P.find(x=>x.id==id);return `<div class="row"><div class="n">${esc(p.name)}<small>${rp(p.price)} × ${cart[id]} = ${rp(p.price*cart[id])}</small></div><span class="q"><button onclick="ch(${id},-1)">−</button>${cart[id]}<button onclick="ch(${id},1)">+</button></span></div>`}).join('')||'<small>Belum ada obat dipilih.</small>';$('tot').textContent=rp(total());rK()}
function rK(){const b=+$('bayar').value||0;$('kem').value=b?(b>=total()?'Kembali '+rp(b-total()):'Kurang '+rp(total()-b)):''}
function pay(){const t=total();if(!t)return alert('Keranjang masih kosong.');const b=+$('bayar').value||0;if(b<t)return alert('Uang diterima kurang dari total.');
const items=Object.keys(cart).map(id=>{const p=P.find(x=>x.id==id);p.stock-=cart[id];return{name:p.name,price:p.price,qty:cart[id]}});
const s={id:(S.length?S[S.length-1].id:0)+1,t:Date.now(),items,total:t,paid:b,change:b-t};S.push(s);save();cart={};$('bayar').value='';rC();rP();prn(s)}
function prn(s){const d=new Date(s.t);$('struk').innerHTML=`<div class="c"><img src="${LOGO}" alt=""><div>Struk #${String(s.id).padStart(5,'0')}</div><div>${d.toLocaleString('id-ID')}</div></div><hr>${s.items.map(i=>`<div>${esc(i.name)}</div><div class="r"><span>${i.qty} × ${rp(i.price)}</span><span>${rp(i.qty*i.price)}</span></div>`).join('')}<hr><div class="r"><b>TOTAL</b><b>${rp(s.total)}</b></div><div class="r"><span>Tunai</span><span>${rp(s.paid)}</span></div><div class="r"><span>Kembali</span><span>${rp(s.change)}</span></div><hr><div class="c">Terima kasih, semoga lekas sehat.</div>`;$('mod').classList.add('on')}
function addP(){const n=$('nn').value.trim(),p=+$('np').value,s=+$('ns').value;if(!n||!(p>0))return alert('Isi nama dan harga obat.');const c=$('nc').value.trim();if(c&&P.some(x=>x.code==c))return alert('Barcode sudah dipakai obat lain.');P.push({id:Math.max(0,...P.map(x=>x.id))+1,name:n,price:p,stock:s||0,code:c});save();$('nn').value=$('np').value=$('ns').value=$('nc').value='';rO()}
function rO(){$('ol').innerHTML=P.map(p=>`<div class="row"><div class="n">${esc(p.name)}<small>${p.code?esc(p.code):"tanpa barcode"}</small></div><input class="ed" type="number" value="${p.price}" onchange="up(${p.id},'price',this.value)" aria-label="Harga"><input class="ed" type="number" value="${p.stock}" style="width:64px" onchange="up(${p.id},'stock',this.value)" aria-label="Stok"><button class="btn s" onclick="del(${p.id})" aria-label="Hapus">Hapus</button></div>`).join('')+'<small>Kolom: harga, stok. Ketuk angka untuk mengubah.</small>'}
function up(id,k,v){P.find(x=>x.id==id)[k]=Math.max(0,+v||0);save()}
function del(id){if(confirm('Hapus obat ini?')){P=P.filter(x=>x.id!=id);delete cart[id];save();rO()}}
function byCode(c){c=String(c).trim();if(!c)return;const p=P.find(x=>x.code==c);p?add(p.id):alert('Barcode '+c+' belum terdaftar. Tambahkan di tab Obat.')}
async function scan(tg){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px';o.innerHTML='<video playsinline muted style="max-width:100%;max-height:65%"></video><div style="color:#fff">Arahkan kamera ke barcode</div><button class="btn" style="width:auto">Tutup</button>';document.body.appendChild(o);const v=o.querySelector('video');let run=true,st,rd;
const done=c=>{run=false;try{rd&&rd.reset()}catch(e){}st&&st.getTracks().forEach(t=>t.stop());o.remove();if(c){tg=='bc'?byCode(c):$('nc').value=c}};
o.querySelector('button').onclick=()=>done();
try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=st;await v.play();
if('BarcodeDetector' in window){const d=new BarcodeDetector();while(run){try{const r=await d.detect(v);if(r.length)return done(r[0].rawValue)}catch(e){}await new Promise(r=>setTimeout(r,250))}}
else if(window.ZXing){rd=new ZXing.BrowserMultiFormatReader();rd.decodeFromStream(st,v,r=>{if(r&&run)done(r.getText())})}
else{done();alert('Browser ini belum mendukung scan kamera.')}}
catch(e){o.remove();alert('Kamera tidak bisa dibuka (izin ditolak atau diblokir). Pakai alat scanner barcode atau ketik kodenya.')}}
rP();rC();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(async()=>{try{DB=await claude.use('db');if(!DB)return st('Tersimpan di perangkat ini');const s=await DB.doc('app/catalog').get();if(s.exists){P=s.data().products||[];try{localStorage.setItem('sv_p2',JSON.stringify(P))}catch(e){}rP();rO()}else if(P.length)await DB.doc('app/catalog').set({products:P,updated:Date.now()});st('Tersimpan di cloud')}catch(e){DB=null;st('Tersimpan di perangkat ini')}})();
</script></body></html>
